# version-aliases.yaml — IKE GA·convention default alias manifest
# shipped as a classified attachment on ike-base-parent.
#
# IKE-Network/ike-issues#470 (parent epic), #473 (this artifact).
#
# This file is the single source of truth for the IKE-curated
# canonical pins and legacy short-name aliases. It is published
# as the `aliases` classifier on every ike-base-parent release so
# external tooling (ike-version-management-extension, lint,
# documentation generators) can read it as data without parsing
# the parent POM.
#
# ike-base-parent's own <properties> block declares the same
# canonical pins and legacy aliases inline, so consumers
# inheriting ike-base-parent get the convention via normal Maven
# property inheritance with no extension required.
#
# Sections:
#
#   canonical: G·A → version
#       Default version pins for the IKE GA·convention. The IKE
#       foundation entries here are conservative defaults; the
#       working values flow from ike-base-parent's own POM
#       inheritance.
#
#   aliases: legacy-short-name → G·A
#       Legacy short-name property idioms from the wider Maven
#       ecosystem and IKE's pre-convention history. ike-base-parent's
#       <properties> block declares each as a one-line
#       indirection to the canonical name.
#
# Schema version 1.
schema: 1

