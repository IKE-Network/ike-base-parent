# release-cascade.yaml — ike-base-parent's edges in the IKE release
# cascade (IKE-Network/ike-issues#420, #498, #526).
#
# Empty upstream list after #526: the IKE-foundation version pins
# (ike-tooling, ike-docs, ike-platform, etc.) moved out of
# ike-base-parent and into ike-parent, where they belong as
# consumer-facing registry. ike-base-parent is now upstream of
# everyone with no IKE-foundation pins of its own — it carries only
# its self-pin and the external-dependency matrix (test stack,
# Eclipse Collections, logging, Maven plugin matrix).
#
# This file has no `downstream:` block either: ike-base-parent is
# terminal in the cascade-walk direction (everything depends ON it;
# it depends on nothing in the cascade-execution sense). It IS
# depended on by every foundation repo, but the cascade walker
# follows the foundation-cascade edges (ike-tooling → ike-docs →
# ike-platform), not the parent-inheritance edges.

schema: 1
terminal: true
upstream: []
