# release-cascade.yaml — ike-base-parent's edges in the IKE release
# cascade (IKE-Network/ike-issues#420, #498).
#
# ike-base-parent is the Tier 0 apex parent: every IKE foundation
# repo (ike-tooling, ike-docs, ike-platform) inherits it, and it
# version-controls the canonical ${G·A} pins for every foundation
# upstream — see <properties> in pom.xml.
#
# Declaring those upstreams here lets `alignUpstreamProperties`
# (ReleasePrep B8) auto-bump the stale canonical pins to the
# latest released version on every ike-base-parent release. The
# canonical pin names (with U+00B7 MIDDLE DOT) are referenced
# directly as `version-property:` — not the short-name aliases —
# because alignUpstreamProperties currently skips any property
# whose value contains `${`, so pointing at the alias indirection
# would no-op the alignment.
#
# This file has no `downstream:` block: ike-base-parent is
# terminal in the cascade-walk direction (everything depends ON
# it; it depends on nothing in the cascade-execution sense).
# It IS depended on by every foundation repo, but the cascade
# walker follows the foundation-cascade edges (ike-tooling →
# ike-docs → ike-platform), not the parent-inheritance edges.

schema: 1
terminal: true

upstream:
  - groupId: network.ike
    artifactId: ike-java-support
    version-property: network.ike·ike-java-support
    url: https://github.com/IKE-Network/ike-java-support.git
  - groupId: network.ike.tooling
    artifactId: ike-tooling
    version-property: network.ike.tooling·ike-tooling
    url: https://github.com/IKE-Network/ike-tooling.git
  - groupId: network.ike.tooling
    artifactId: ike-workspace-extension
    version-property: network.ike.tooling·ike-workspace-extension
    url: https://github.com/IKE-Network/ike-workspace-extension.git
  - groupId: network.ike.tooling
    artifactId: ike-version-management-extension
    version-property: network.ike.tooling·ike-version-management-extension
    url: https://github.com/IKE-Network/ike-version-management-extension.git
  - groupId: network.ike.docs
    artifactId: ike-docs
    version-property: network.ike.docs·ike-docs
    url: https://github.com/IKE-Network/ike-docs.git
  - groupId: network.ike.platform
    artifactId: ike-platform
    version-property: network.ike.platform·ike-platform
    url: https://github.com/IKE-Network/ike-platform.git
